name: geneval
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision
  - pytorch-cuda=12.1
  - pip
  - pip:
    - --find-links https://download.openmmlab.com/mmcv/dist/cu121/torch2.0.1/index.html
    - mmdet>=3.0.0
    - mmcv==2.1.0
    - mmengine>=0.8.0
    - pillow
    - tqdm
    - numpy<2.0
    - scipy
    - pycocotools
    - opencv-python
