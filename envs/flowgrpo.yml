name: flowgrpo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip
  - pip:
    - diffusers>=0.30.0
    - transformers>=4.40.0
    - accelerate>=0.30.0
    - wandb
    - bitsandbytes
    - peft>=0.10.0
    - safetensors
    - huggingface_hub>=0.23.0
    - sentencepiece
    - protobuf
    - scipy
    - pillow
    - tqdm
    - omegaconf
    - einops
    - pytorch-lightning
